name: Docs

on:
  push:
    branches: [master]
    paths: ["**/*.md", ".markdownlint-cli2.yaml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**/*.md", ".markdownlint-cli2.yaml", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          config: .markdownlint-cli2.yaml
